<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Intro da logo -->
    <div class="intro">
        <h1 class="intro-logo">
            Aroma <br>
            Matcha
        </h1>
    </div>

    <!-- Video atrás -->
    <section class="video">
        <video muted loop playsinline class="video-cabecalho" id="video-cabecalho">
            <!--Playsinline: Evita que alguns celulares abram o vídeo em tela cheia-->
            <source src="./video-cabecalho.mp4" type="video/mp4">
        </video>


        <div class="overlay"></div> <!-- Camada escura -->


        <header>
            <!-- Logo -->
            <h1 class="logo">
                Aroma <br>
                Matcha
            </h1>

            <!-- Menu -->
            <nav class="menu-desktop">
                <a href="#">Home</a>
                <a href="#">Product Line</a>
                <a href="#">Nossas lojas</a>
                <a href="#">Cardápio</a>
                <a href="#">Clube</a>
                <a href="#">Contato</a>
                <a href="#">Franqueado</a>
            </nav>

            <!-- Ícone Redes sociais -->
            <nav class="social-desktop">
                <a href="https://www.instagram.com" target="_blank">
                    <i class="fa-brands fa-instagram"></i> <!--ícone instagram-->
                </a>

                <a href="https://www.tiktok.com" target="_blank">
                    <i class="fa-brands fa-tiktok"></i> <!--ícone tiktok-->
                </a>

                <a href="https://open.spotify.com/" target="_blank">
                    <i class="fa-brands fa-spotify"></i> <!--ícone spotify-->
                </a>

                <a href="https://www.whatsapp.com" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> <!--ícone whatsapp-->
                </a>

            </nav>

        </header>

    </section>

    <script src="script.js"></script>

    <main>

    </main>


    <footer>

    </footer>
</body>

</html>
